name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/PivotScope.Web/package-lock.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Tests must pass before anything is published: a broken release costs
      # more than a late one.
      - name: Tests
        run: |
          npm --prefix src/PivotScope.Web ci
          npm --prefix src/PivotScope.Web run build
          dotnet test -c Release -p:SkipSpaBuild=true --filter "Category!=Integration"

      - name: Package
        shell: pwsh
        run: ./build/pack.ps1 -Version ${{ steps.version.outputs.value }}

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/PivotScope.zip
          generate_release_notes: true
          body: |
            ## Installation

            Unzip anywhere, then in Excel:
            **File → Options → Add-ins → Manage: _Excel Add-ins_ →
            Go → Browse**, and pick `PivotScope64.xll`.

            Do not double-click the `.xll`: Excel would treat it as a
            workbook and wrongly report a corrupted file.

            ### Requirements

            - Excel **64-bit**, 2016 or later
            - [.NET Desktop Runtime 10](https://dotnet.microsoft.com/download/dotnet/10.0) (x64)
            - WebView2 Evergreen (installed by default on Windows 11)
            - A reachable **SSAS Multidimensional** cube
            - Optional: `ANTHROPIC_API_KEY` for the MDX assistant
